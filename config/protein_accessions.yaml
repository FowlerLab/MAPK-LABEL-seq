# Protein accessions for HGVS output, and the evidence for each.
#
# `uniprot` is the isoform whose sequence our variant positions actually match --
# NOT necessarily the UniProt canonical. Every accession here was validated by
# fetching its sequence and checking the wild-type residue at every position we
# score; `wt_validation` is that result. The terminal stop codon sits at length+1
# by construction and is not counted as a mismatch.
#
# `ensembl_protein` is UniProt's Ensembl cross-reference FOR THAT ISOFORM, or null
# where none encodes our sequence. The amino-acid sequence was validated against
# UniProt directly; the ENSP is a mapped identifier, not an independently fetched
# sequence. Every ENSP here was verified by fetching its translation from Ensembl
# and requiring a character-for-character match; see
# output/scoring/ensembl_protein_verification.tsv and
# scripts/verify_ensembl_proteins.py.
#
# Regenerate with scripts/build_protein_accessions.py.
