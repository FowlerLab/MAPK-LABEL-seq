# =============================================================================
# DMS Interface Interaction Analysis — Predictomes (SPOC >= 0.69)
# Control residue strategy: domain-restricted surface (RSA > 0.25), >10 A (no outer cap)
# =============================================================================
#
# Run with:
#   python interactions/main.py --config config/config_predictomes_dom_r25_gt10.yaml
#
# Control residue criteria:
#   (1) RSA > 0.25 (literature-standard surface threshold)
#   (2) Within an annotated protein domain (control_within_domains: true)
#   (3) Not at the interface in this structure (>6 Å from partner chain)
#   (4) >= 10 Å from nearest interface residue (exclusion zone, intrachain C-beta)
#   (5) No outer distance cap
#
# pLDDT filter applied (AlphaFold B-factor = pLDDT confidence):
#   Residues below plddt_threshold: 60 are excluded from analysis.
#
# SPOC threshold >= 0.69 (same as config_predictomes_spoc069.yaml, FDR ~20%).
#
# CHANGE LOG
# ----------
# 2026-03-05  Created. Adapts config_pdb_ctrl_domains_rsa25_gt10A.yaml for
#             Predictomes predictions. Uses SPOC >= 0.69 metadata and pLDDT
#             filtering at 60.0, matching config_predictomes_spoc069.yaml.

# =============================================================================
# INPUT FILES
# =============================================================================

scores:
  file: "../output/annotated_combined.tsv"
  # Accession -> HGNC symbol. The score table's `protein` column holds
  # library-style names (craf, mek1, mek2, shp2); everything downstream is keyed
  # on HGNC symbols, so gene_name is derived from the accession instead.
  gene_symbol_map: "../interactions/gene_symbols.json"
  columns:
    variant: "variant"
    position: "position"
    score: "mean_WT_relative_score"
    assay: "assay"
    library: "library"
    uniprot_id: "uniprot_accession"
    gene_name: "protein"
    mutation_type: "variant_category"
    assay_treatment: "assay_treatment"

  filters:
    mutation_types: ["missense"]
    # Two assay conditions only: abundance and activity, both from the
    # untreated/vehicle arm. 2026-08-06: dropped the abundance_HSP90i
    # additional condition and the EGFR activity SerumStarve override so every
    # panel reports the same baseline treatment.
    treatment_filters:
      default: ["No_treatment", "DMSO"]

predictions:
  - name: "Predictomes"
    directory: "../data/interactions/predictomes_MAPK/"
    metadata: "../data/interactions/predictomes_MAPK/matching_interactions_spoc069.csv"
    metadata_format: "predictomes"
    filename_pattern: "(?P<complex_name>[A-Z0-9]+_HUMAN__[A-Z0-9]+_HUMAN__\\d+aa)_unrelaxed_rank_(?P<rank>\\d+)_.*"

domains:
  info_file: "../interactions/domain_info.json"
  colors_file: "../interactions/domain_colors.json"

# =============================================================================
# STRUCTURE QUALITY FILTERING
# =============================================================================

structure_filters:
  # AlphaFold stores per-residue pLDDT in B-factor column (0-100 scale).
  # Residues below this threshold are excluded from interface and control sets.
  plddt_threshold: 60.0
  min_residues_after_filter: 10

# =============================================================================
# ANALYSIS PARAMETERS
# =============================================================================

parameters:
  contact_distance: 6.0
  surface_rsa: 0.25

  # Domain-restricted controls with exclusion zone, no outer cap.
  control_within_domains: true
  control_spatial_distance_min: 10.0
  control_spatial_distance: 9999.0

  control_use_global_interface: false

  min_positions_per_group: 3

# =============================================================================
# STATISTICS TO COMPUTE
# =============================================================================

statistics:
  mann_whitney: true
  ks_test: true
  permutation_test: true
  permutation_n: 1000
  cohens_d: true
  cliffs_delta: true
  log_fold_change: true
  auroc: true
  wasserstein: true
  bootstrap_ci: true
  bootstrap_n: 1000
  bootstrap_ci_level: 0.95
  fdr_correction: true
  fdr_method: "fdr_bh"

# =============================================================================
# SIGNIFICANCE THRESHOLDS
# =============================================================================

thresholds:
  pvalue: 0.001
  fdr_pvalue: 0.05
  auroc: 0.0
  min_effect_size: 0.3

# =============================================================================
# OUTPUT SETTINGS
# =============================================================================

output:
  directory: "../output/interactions/predictomes_output_dom_r25_gt10/"
  generate_plots: true
  generate_pymol: false
  generate_heatmaps: false

# =============================================================================
# PARALLELIZATION
# =============================================================================

parallel:
  n_cores: 10

# =============================================================================
# SGE CLUSTER SETTINGS
# =============================================================================

sge:
  memory_per_core: "10G"
  n_cores: 10
  runtime: "8:00:00"
  project: null

# =============================================================================
# SOFTWARE PATHS
# =============================================================================

paths:
  pymol: "$HOME/pymol/pymol"
  dssp: "mkdssp"
