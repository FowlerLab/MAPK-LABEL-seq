# ---------------------------------------------------------------------------
# Single-part libraries, C-terminally MCP-tagged
# Nonsense variants are excluded from abundance assays because the stop codon
# truncates the protein before the C-terminal MCP tag → tag not translated →
# barcode cannot be co-enriched → artifactual measurement.
# ---------------------------------------------------------------------------

