# ===========================================================================
# Per-library metadata for the LABEL-seq MAPK pipeline
# ===========================================================================
#
# Each entry is keyed by LIBRARY NAME (as it appears in raw data filenames).
# For split proteins (>~550aa), there are separate entries for nterm and cterm.
#
# Fields:
#   gene_name:        HGNC gene symbol
#   uniprot_id:       UniProt accession (canonical isoform)
#   protein:          Base protein name (for split libraries; omit if same as key)
#   protein_length:   Full-length protein in amino acids
#   library_coverage: [first_residue, last_residue] in UniProt numbering
#   raw_indexing:      0 or 1 — whether the raw variant positions are 0- or 1-indexed
#   position_offsets:  Per-assay offsets to convert raw → UniProt positions.
#                      Computed as: (first UniProt residue in library - 1) if 1-indexed,
#                                   (first UniProt residue in library) if 0-indexed.
#   mcp_tag_position: N-terminal or C-terminal MCP tag on the variant protein.
#                     C-terminal → nonsense variants excluded from abundance.
#   client_status:    HSP90 interaction status (strong/weak/non/unknown).
#                     Source: Generate_table.ipynb; reflects literature, not this experiment.
#   domains:          {name: [start, end]} — domain boundaries in UniProt numbering.
#   verification:     Known variant used to confirm position numbering.
#
# IMPORTANT: position_offsets must exactly match the notebook offset table.
# Verified against 19 known disease variants on 2026-04-05.
# ===========================================================================

# ---------------------------------------------------------------------------
# Single-part libraries (protein ≤ ~550aa, cloned as one piece)
# ---------------------------------------------------------------------------

